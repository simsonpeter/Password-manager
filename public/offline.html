<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AccessVault is offline</title>
    <style>
      body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f3f6fa; color: #0f172a; }
      main { max-width: 36rem; margin: 10vh auto; padding: 1.5rem; }
      h1 { color: #0b1f3a; }
      p { line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>AccessVault needs a connection to sign in, search, reveal codes, and sync changes.</p>
      <p>This install does not keep a readable copy of your vault on the device. Reconnect, then open the app again.</p>
    </main>
  </body>
</html>
