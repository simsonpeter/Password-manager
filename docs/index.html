<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Cloud gate and port codes — login from any device">
  <title>Gate &amp; Port Codes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="screen-login" class="screen auth-page">
    <main class="auth-card">
      <div class="auth-icon" aria-hidden="true">☁️</div>
      <h1>Cloud Login</h1>
      <p class="auth-subtitle">Sign in to access your codes from any phone.</p>
      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email" placeholder="your@email.com">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="Your password">
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <p class="auth-footer">
        No account?
        <button type="button" class="auth-link" id="btn-go-register">Create account</button>
      </p>
    </main>
  </section>

  <!-- REGISTER -->
  <section id="screen-register" class="screen auth-page hidden">
    <main class="auth-card">
      <div class="auth-icon" aria-hidden="true">✨</div>
      <h1>Create account</h1>
      <p class="auth-subtitle">Your codes will be saved in the cloud.</p>
      <form id="register-form" class="auth-form">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" required autocomplete="email" placeholder="your@email.com">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        <label for="register-confirm">Confirm password</label>
        <input type="password" id="register-confirm" required minlength="6" autocomplete="new-password" placeholder="Repeat password">
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <p class="auth-footer">
        Already have an account?
        <button type="button" class="auth-link" id="btn-go-login">Sign in</button>
      </p>
    </main>
  </section>

  <!-- MAIN APP -->
  <section id="screen-app" class="screen hidden app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon" aria-hidden="true">🚪</span>
        <div>
          <h1>Gate &amp; Port Codes</h1>
          <p class="user-email" id="user-email"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-settings" title="Change password">⚙️</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout">Out</button>
      </div>
    </header>

    <!-- TAB: CODES -->
    <div id="tab-codes" class="tab-panel active">
      <div class="tab-toolbar">
        <input type="search" id="search" class="search-input" placeholder="Search names…" autocomplete="off">
        <span class="badge" id="entry-count">0</span>
      </div>
      <div id="entries-list" class="entries-list tab-scroll"></div>
    </div>

    <!-- TAB: ADD -->
    <div id="tab-add" class="tab-panel">
      <div class="tab-scroll panel-form-inner">
        <h2 id="form-title">Add new</h2>
        <p class="panel-hint">Name + codes (1st, 2nd, 3rd…). Saved to cloud when you tap Save.</p>
        <form id="entry-form">
          <input type="hidden" id="entry-id" value="">
          <div class="field">
            <label for="entry-name">Name <span class="req">*</span></label>
            <input type="text" id="entry-name" required placeholder="e.g. Client — Main gate" autocomplete="off">
          </div>
          <div class="field">
            <label>Codes</label>
            <div id="codes-container" class="codes-container"></div>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-add-code">+ Add another code</button>
          </div>
          <div class="field">
            <label for="entry-notes">Notes <span class="optional">(optional)</span></label>
            <textarea id="entry-notes" rows="3" placeholder="Location, directions…"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block" id="btn-save">Save to cloud</button>
            <button type="button" class="btn btn-ghost btn-block hidden" id="btn-cancel">Cancel edit</button>
          </div>
        </form>
      </div>
    </div>

    <nav class="tab-bar" role="tablist">
      <button type="button" class="tab-btn active" data-tab="codes" role="tab" aria-selected="true">
        <span class="tab-icon" aria-hidden="true">📋</span>
        <span>Codes</span>
      </button>
      <button type="button" class="tab-btn" data-tab="add" role="tab" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">➕</span>
        <span>Add</span>
      </button>
    </nav>
  </section>

  <dialog id="password-dialog" class="modal">
    <form id="password-form">
      <h3>Change password</h3>
      <div class="field">
        <label for="current-password">Current</label>
        <input type="password" id="current-password" required autocomplete="current-password">
      </div>
      <div class="field">
        <label for="new-password">New</label>
        <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new</label>
        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
      </div>
      <p class="form-error hidden" id="password-error"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="btn-close-dialog">Cancel</button>
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
