{% extends "base.html" %}
{% block title %}Login — Gate & Port Codes{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main class="auth-card">
  <div class="auth-icon">🔒</div>
  <h1>Gate &amp; Port Codes</h1>
  <p class="auth-subtitle">Enter your app password to continue.</p>
  <form method="post" class="auth-form">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus autocomplete="current-password" placeholder="Your app password">
    <button type="submit" class="btn btn-primary btn-block">Unlock</button>
  </form>
  <p class="auth-footer">
    <a class="auth-link" href="{{ url_for('main.forgot_password') }}">Forgot password?</a>
  </p>
</main>
{% endblock %}
